name: Check offline lookup
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 tools/snapshot.py assets
      - run: node tools/check-search.mjs
      - name: Verify the bundled FAA workbook
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          lock = json.loads(pathlib.Path('assets/sources.json').read_text())
          assert hashlib.sha256(pathlib.Path('data/faa.xlsx').read_bytes()).hexdigest() == lock['faa']['sha256']
          PY
